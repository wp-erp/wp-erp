name: Set up an ERP site for testing
description: >
    Unpacks the pre-built plugins, boots wp-env, installs Playwright and seeds
    the site. Every test job needs exactly this, so it lives in one place rather
    than being repeated five times and drifting.

inputs:
    pro-built:
        description: Result of the build_erp_pro job — Pro is skipped when it did not succeed.
        required: false
        default: 'success'
    seed:
        description: >
            Set to 'false' to boot the site without seeding it. The licence
            teardown needs a running site to drive the deactivate form, but
            seeding would ACTIVATE the seat it is about to release.
        required: false
        default: 'true'

runs:
    using: composite
    steps:
        - name: Download wp-erp build
          uses: actions/download-artifact@v4
          with:
              name: wp-erp-build
              path: /tmp/

        - name: Extract wp-erp build
          shell: bash
          run: |
              tar -xzf /tmp/wp-erp-build.tar.gz
              rm /tmp/wp-erp-build.tar.gz

        - name: Download erp-pro build
          if: inputs.pro-built == 'success'
          uses: actions/download-artifact@v4
          with:
              name: erp-pro-build
              path: /tmp/

        # `.wp-env.ci.json` resolves paths from tests/pw, and points at
        # `../../erp-pro` — that is $GITHUB_WORKSPACE/erp-pro, exactly where the
        # old workflow's `path: erp-pro` checkout put it. Unpacking anywhere else
        # leaves wp-env pointing at nothing.
        - name: Extract erp-pro build
          if: inputs.pro-built == 'success'
          shell: bash
          run: |
              mkdir -p erp-pro
              tar -xzf /tmp/erp-pro-build.tar.gz -C erp-pro
              rm /tmp/erp-pro-build.tar.gz

        # Without erp-pro on disk, `.wp-env.ci.json` still lists it under
        # `plugins`, and wp-env aborts the whole boot with "No plugins
        # activated" rather than skipping the missing one. So the free-only run
        # needs an override that does not mention it at all.
        - name: Run the free suite only when Pro is unavailable
          if: inputs.pro-built != 'success'
          shell: bash
          run: |
              echo "ERP_PRO=false" >> "$GITHUB_ENV"
              node -e '
                const fs = require("fs");
                const path = "tests/pw/.wp-env.ci.json";
                const cfg = JSON.parse(fs.readFileSync(path, "utf8"));
                cfg.plugins = (cfg.plugins || []).filter(p => !String(p).includes("erp-pro"));
                for (const key of Object.keys(cfg.mappings || {})) {
                  if (key.includes("erp-pro")) delete cfg.mappings[key];
                }
                fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
                console.log("erp-pro unavailable — running the free suite only");
              '

        - name: Use Node 20
          uses: actions/setup-node@v4
          with:
              node-version: 20
              cache: npm
              cache-dependency-path: tests/pw/package-lock.json

        - name: Install suite dependencies
          shell: bash
          working-directory: tests/pw
          run: npm ci --prefer-offline --no-audit --no-fund || npm i

        # Keyed on the Playwright version so a bump fetches fresh browsers
        # instead of silently reusing incompatible ones.
        - name: Cache Playwright browsers
          id: pw-browsers
          uses: actions/cache@v4
          with:
              path: ~/.cache/ms-playwright
              key: pw-browsers-${{ runner.os }}-${{ hashFiles('tests/pw/package-lock.json') }}

        - name: Install Chromium
          shell: bash
          working-directory: tests/pw
          run: npx playwright install --with-deps chromium

        # `.wp-env.ci.json` lists wp-erp and erp-pro under `plugins` rather than
        # only `mappings`, which is what ACTIVATES them on a runner — the local
        # config maps them onto disk inactive. The setup bootstrap activates them
        # too, so this is belt and braces rather than the only path.
        # Retried, because wp-env BUILDS its images on every fresh runner and one
        # of those layers is `composer global require phpunit/phpunit`, pulled
        # unauthenticated from api.github.com. That returns HTTP 504 often enough
        # to matter, and composer runs with source fallback disabled, so a single
        # 504 fails the whole boot:
        #
        #   Failed to download sebastian/recursion-context from dist:
        #   ... could not be downloaded (HTTP/2 504)
        #   Source fallback is disabled. Not trying alternative sources.
        #
        # It took down the teardown job in run 32706762121 while four other jobs
        # in the same run built the identical image without trouble.
        #
        # This retries the ENVIRONMENT only. It never re-runs a test or hides an
        # assertion; a suite failure still fails the job on the first attempt.
        - name: Start wp-env
          shell: bash
          working-directory: tests/pw
          run: |
              cp .wp-env.ci.json .wp-env.override.json
              for attempt in 1 2 3; do
                  if npm run start:env; then
                      booted=yes
                      break
                  fi
                  echo "::warning::wp-env boot attempt ${attempt} failed"
                  npx wp-env destroy --scripts false || true
                  sleep $(( attempt * 20 ))
              done
              if [ "${booted:-no}" != yes ]; then
                  echo "::error::wp-env did not boot after 3 attempts"
                  exit 1
              fi
              curl --retry 12 --retry-delay 5 --retry-all-errors -sf http://localhost:8888/ > /dev/null

        # Activates the licence and stands a bare WordPress install up into a
        # runnable site: plugins, core modules, Pro modules, three setup wizards,
        # permalinks, company, currency, timezone.
        - name: Seed site (licence, modules, actors, fixtures)
          if: inputs.seed != 'false'
          shell: bash
          working-directory: tests/pw
          run: npm run setup
