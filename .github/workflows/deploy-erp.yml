name: Deploy to WordPress.org
on:
  push:
    tags:
      - "*"
  # Manual run: builds Vue + React and uploads the zip as a run artifact. The
  # WordPress.org deploy step below is skipped, so a dispatch (on a fork or on
  # the org repo) can never publish a release.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tag:
    name: Deploy plugin for new Tag
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
      - name: Use Node.js 12.1.0
        uses: actions/setup-node@v4
        with:
          node-version: '12.1.0'
          cache: 'npm'
      - name: Use desired version of php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: wp-cli
      - name: Install and build
        run: |
          npm ci
          npm run build

      # The HR React admin builds on Node 24 + pnpm (the legacy Vue build above
      # runs on Node 12). Without this, dist-react is never produced and the
      # WordPress.org zip ships with no React UI.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js 24 for React build
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build HR React admin
        run: npm run build:react

      # Back to Node 12 for the POT step: makepot runs wpvuei18n, which belongs to
      # the legacy Node 12 toolchain. (Its makepot:react half is wp-cli/PHP and is
      # Node-agnostic, but it has to run after the React build so dist-react exists.)
      - name: Restore Node.js 12.1.0 for tooling
        uses: actions/setup-node@v4
        with:
          node-version: '12.1.0'
      - name: Generate POT
        run: npm run makepot
      - name: Composer install and build
        run: |
          composer install --no-dev --optimize-autoloader
      - name: Generate zip
        uses: 10up/action-wordpress-plugin-build-zip@stable
        with:
          retention-days: 5
        env:
          SLUG: erp # wp.org slug differs from repo name (wp-erp)
      # Only a tag push on the org repo publishes. Fork runs and manual dispatches
      # stop at the zip artifact above.
      - name: WordPress Plugin Deploy
        if: github.event_name == 'push' && github.repository == 'wp-erp/wp-erp'
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: false
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: erp
          ASSETS_DIR: .wordpress-org
