# Kept at .github/workflows/playwright.yml deliberately.
#
# GitHub keys a workflow by its FILE PATH and only lists or dispatches workflows
# whose file is on the default branch. A new filename would mean the suite could
# not be triggered manually until after its branch merged, and would start a
# fresh entry with no run history. Reusing this path keeps the existing
# "E2E_API Tests" entry, its history, and the ability to dispatch it against a
# feature branch before merging.
name: E2E_API Tests

on:
    # Runs once a day, plus the "Run workflow" button below for on-demand runs.
    #
    # Push and pull_request triggers are deliberately ABSENT, for a reason
    # sharper here than on other repositories: the erp-pro licence grants ONE
    # active site (`license_limit: 1`), and every test job activates it. A run on
    # every push would hold that seat more or less permanently and block the
    # developers' own sites, on top of the Actions cost.
    schedule:
        # 02:00 UTC. GitHub queues scheduled runs and releases them when capacity
        # frees up, so the real start drifts later than the nominal time — check
        # the actual start times of recent scheduled runs before "correcting"
        # this to a different hour.
        - cron: '0 2 * * *'
    # Manual runs: pick which suite to run. E2E always runs in full.
    workflow_dispatch:
        inputs:
            testsuite:
                description: 'Which suite to run'
                default: 'All'
                type: choice
                options:
                    - All
                    - E2E
                    - Money
                    - API
                    - License

# The erp-pro licence allows ONE active site at a time (license_limit: 1), so two
# RUNS must never overlap. Queue instead of cancelling: a cancelled run skips its
# deactivate step and would strand the seat.
concurrency:
    group: erp-pro-license
    cancel-in-progress: false

env:
    BASE_URL: http://localhost:8888
    SERVER_URL: http://localhost:8888
    DB_HOST: 127.0.0.1
    DB_PORT: '8889'
    DB_USER: root
    DB_PASSWORD: password
    DB_NAME: wordpress
    DB_PREFIX: wp_
    # `ADMIN`, not `ADMIN_USERNAME` — utils/helpers.ts reads env('ADMIN') and
    # throws on a missing required variable.
    ADMIN: admin
    ADMIN_PASSWORD: password
    ADMIN_EMAIL: admin@erp.test
    # No literal fallback: this repository is public. Without the secret the
    # suite fails fast rather than running under a published credential.
    USER_PASSWORD: ${{ secrets.ERP_USER_PASSWORD }}
    HR_MANAGER: erp_hr_manager
    CRM_MANAGER: erp_crm_manager
    CRM_AGENT: erp_crm_agent
    CRM_AGENT_2: erp_crm_agent_2
    ACCOUNT_MANAGER: erp_ac_manager
    RECRUITER: erp_recruiter
    EMPLOYEE: erp_employee
    ERP_PRO: 'true'
    ERP_TEST_KEY: erp-pw-local
    ERP_LICENSE_EMAIL: ${{ secrets.ERP_LICENSE_EMAIL }}
    ERP_LICENSE_KEY: ${{ secrets.ERP_LICENSE_KEY }}
    ERP_LICENSE_USERS: ${{ vars.ERP_LICENSE_USERS || '100' }}
    CI: 'true'
    HEADLESS: 'true'

jobs:
    # ---------------------------------------------------------------------
    # 1. Build each plugin once, cache its dependencies, hand the result to
    #    every test job as a tarball. Without this each shard would repeat the
    #    same composer + npm build.
    # ---------------------------------------------------------------------
    build_wp_erp:
        name: build wp-erp
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout wp-erp
              uses: actions/checkout@v4

            # Node comes from the repo's own .nvmrc (12.1.0), confirmed with the
            # plugin developer — not a version picked here. Reading the file
            # rather than hardcoding a number means CI follows the project when
            # that pin moves.
            #
            # The build is REQUIRED: nine bundles are gitignored, not committed —
            # the Settings SPA (assets/js/erp-settings.js, vendor.js) and the
            # Accounting SPA (modules/accounting/assets/js/admin.js, bootstrap.js).
            # Without them those screens render no JavaScript at all, which showed
            # up as "the General tab is offered" and every accounting screen
            # failing. The workflow previously on develop skipped this build,
            # which is why its scheduled runs had been red.
            #
            # The version also has to satisfy node-sass ^4.13, whose native module
            # has no prebuilt binary past Node 14 and dies in node-gyp on anything
            # newer. Node 20 was the original mistake here.
            - name: Use the Node version the project pins
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Composer install (wp-erp)
              run: composer install --no-dev -o || composer update --no-dev -o

            - name: Cache node_modules (wp-erp)
              id: erp-nm
              uses: actions/cache@v4
              with:
                  path: node_modules
                  key: erp-nm-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

            - name: Npm install (wp-erp)
              if: steps.erp-nm.outputs.cache-hit != 'true'
              run: npm ci --prefer-offline --no-audit --no-fund || npm i

            - name: Npm build (wp-erp) — produces the gitignored SPA bundles
              run: npm run build

            - name: Confirm the SPA bundles exist
              run: |
                  for f in assets/js/erp-settings.js assets/js/vendor.js \
                           modules/accounting/assets/js/admin.js; do
                      if [ ! -s "$f" ]; then
                          echo "::error::$f was not produced — the SPA screens will render no JavaScript"
                          exit 1
                      fi
                      echo "  ok $f ($(wc -c < "$f") bytes)"
                  done

            - name: Tar wp-erp build output
              run: |
                  tar --exclude=./.git \
                      --exclude=./node_modules \
                      --exclude=./tests/pw/node_modules \
                      --exclude=./tests/pw/playwright \
                      --exclude=./tests/pw/playwright-report \
                      --exclude=./tests/pw/wp-data \
                      --exclude=./tests/pw/test-results \
                      -czf /tmp/wp-erp-build.tar.gz .

            - name: Upload wp-erp build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: wp-erp-build
                  path: /tmp/wp-erp-build.tar.gz
                  retention-days: 1
                  compression-level: 0

    build_erp_pro:
        name: build erp-pro
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            # Needs a token with read access to the PRIVATE wp-erp/erp-pro repo.
            # A 403 here means ERP_PRO_TOKEN is missing, expired, or lacks that
            # repository — it is not a problem with the suite.
            - name: Checkout erp-pro
              uses: actions/checkout@v4
              with:
                  repository: wp-erp/erp-pro
                  ref: develop
                  token: ${{ secrets.ERP_PRO_TOKEN }}

            # Same as wp-erp: erp-pro ships its built assets (58 committed
            # .min.js files) and pins node-sass ^4.7, so a build would only
            # fail. composer install for the autoloader is all that is needed.
            - name: Composer install (erp-pro)
              run: composer install --no-dev -o || composer update --no-dev -o || true

            - name: Tar erp-pro build output
              run: |
                  tar --exclude=./.git --exclude=./node_modules \
                      -czf /tmp/erp-pro-build.tar.gz .

            - name: Upload erp-pro build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: erp-pro-build
                  path: /tmp/erp-pro-build.tar.gz
                  retention-days: 1
                  compression-level: 0

    # ---------------------------------------------------------------------
    # 2. E2E, sharded. Each shard stands up its own wp-env and runs a slice.
    # ---------------------------------------------------------------------
    e2e_tests:
        name: e2e tests
        runs-on: ubuntu-latest
        timeout-minutes: 60
        needs: [build_wp_erp, build_erp_pro]
        if: always() && needs.build_wp_erp.result == 'success' && (github.event.inputs.testsuite == '' || github.event.inputs.testsuite == 'All' || github.event.inputs.testsuite == 'E2E')
        strategy:
            fail-fast: false
            matrix:
                shardIndex: [1, 2, 3, 4]
                shardTotal: [4]
        steps:
            # A local composite action only exists once the repo is on disk, so
            # the checkout has to come first. The build tarball is unpacked over
            # the top of it by the action below.
            - uses: actions/checkout@v4

            - uses: ./.github/actions/setup-erp-site
              id: site
              with:
                  pro-built: ${{ needs.build_erp_pro.result }}

            - name: e2e (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
              working-directory: tests/pw
              env:
                  PW_JSON_OUT: playwright-report/results-e2e.json
              run: npm run test:e2e -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

            - name: Upload blob report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: blob-e2e-${{ matrix.shardIndex }}
                  path: tests/pw/blob-report
                  retention-days: 1
                  if-no-files-found: ignore

            - name: Upload results json
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: results-e2e-${{ matrix.shardIndex }}
                  path: tests/pw/playwright-report/results-e2e.json
                  retention-days: 1
                  if-no-files-found: ignore

    # ---------------------------------------------------------------------
    # 3. Money. NOT sharded, and it cannot be: these specs share one Cash
    #    ledger and one voucher sequence, which no scoping can isolate. Run in
    #    parallel they break each other's preconditions.
    # ---------------------------------------------------------------------
    money_tests:
        name: accounting money tests
        runs-on: ubuntu-latest
        timeout-minutes: 60
        needs: [build_wp_erp, build_erp_pro]
        if: always() && needs.build_wp_erp.result == 'success' && (github.event.inputs.testsuite == '' || github.event.inputs.testsuite == 'All' || github.event.inputs.testsuite == 'Money')
        steps:
            # A local composite action only exists once the repo is on disk, so
            # the checkout has to come first. The build tarball is unpacked over
            # the top of it by the action below.
            - uses: actions/checkout@v4

            - uses: ./.github/actions/setup-erp-site
              with:
                  pro-built: ${{ needs.build_erp_pro.result }}

            - name: money (serial)
              working-directory: tests/pw
              env:
                  PW_JSON_OUT: playwright-report/results-money.json
              run: npm run test:money

            - name: Upload blob report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: blob-money
                  path: tests/pw/blob-report
                  retention-days: 1
                  if-no-files-found: ignore

            - name: Upload results json
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: results-money
                  path: tests/pw/playwright-report/results-money.json
                  retention-days: 1
                  if-no-files-found: ignore

    # ---------------------------------------------------------------------
    # 4. REST API.
    # ---------------------------------------------------------------------
    api_tests:
        name: api tests
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [build_wp_erp, build_erp_pro]
        if: always() && needs.build_wp_erp.result == 'success' && (github.event.inputs.testsuite == '' || github.event.inputs.testsuite == 'All' || github.event.inputs.testsuite == 'API')
        steps:
            # A local composite action only exists once the repo is on disk, so
            # the checkout has to come first. The build tarball is unpacked over
            # the top of it by the action below.
            - uses: actions/checkout@v4

            - uses: ./.github/actions/setup-erp-site
              with:
                  pro-built: ${{ needs.build_erp_pro.result }}

            - name: api
              working-directory: tests/pw
              env:
                  PW_JSON_OUT: playwright-report/results-api.json
              run: npm run test:api

            - name: Upload results json
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: results-api
                  path: tests/pw/playwright-report/results-api.json
                  retention-days: 1
                  if-no-files-found: ignore

    # ---------------------------------------------------------------------
    # 5. Licence limit. MANUAL ONLY, never on the schedule and never in "All":
    #    it seeds ~69 users to stand the site on its purchased seat limit, and
    #    while it runs no other spec can create an employee.
    # ---------------------------------------------------------------------
    license_tests:
        name: licence limit tests
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [build_wp_erp, build_erp_pro]
        if: always() && needs.build_wp_erp.result == 'success' && github.event.inputs.testsuite == 'License'
        steps:
            # A local composite action only exists once the repo is on disk, so
            # the checkout has to come first. The build tarball is unpacked over
            # the top of it by the action below.
            - uses: actions/checkout@v4

            - uses: ./.github/actions/setup-erp-site
              with:
                  pro-built: ${{ needs.build_erp_pro.result }}

            - name: licence limit
              working-directory: tests/pw
              env:
                  PW_JSON_OUT: playwright-report/results-license.json
              run: npm run test:license-limit

            - name: Upload results json
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: results-license
                  path: tests/pw/playwright-report/results-license.json
                  retention-days: 1
                  if-no-files-found: ignore

    # ---------------------------------------------------------------------
    # 6. Release the licence seat, exactly once, after every test job.
    #
    #    This is a JOB rather than a step inside each test job on purpose. With
    #    one seat and several jobs running at once, a per-job deactivate would
    #    let the first shard to finish pull the licence out from under the ones
    #    still running. Releasing once, at the end, is the only safe shape.
    #
    #    `if: always()` — a run that dies mid-suite must still hand the seat
    #    back, or the next run cannot activate at all.
    # ---------------------------------------------------------------------
    license_teardown:
        name: release the licence seat
        if: always()
        needs: [e2e_tests, money_tests, api_tests, license_tests]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - name: Use Node 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: tests/pw/package-lock.json

            - name: Install suite dependencies
              working-directory: tests/pw
              run: npm ci --prefer-offline --no-audit --no-fund || npm i

            - name: Install Chromium
              working-directory: tests/pw
              run: npx playwright install --with-deps chromium

            # The teardown drives the real admin form, so it needs a site to
            # drive. Booting a throwaway one is cheaper than leaving the seat
            # stranded, which blocks every later run and the developers' sites.
            - name: Start wp-env
              working-directory: tests/pw
              run: |
                  cp .wp-env.ci.json .wp-env.override.json
                  npm run start:env
                  curl --retry 12 --retry-delay 5 --retry-all-errors -sf http://localhost:8888/ > /dev/null

            - name: Deactivate licence
              working-directory: tests/pw
              run: npm run teardown:license || echo "::warning::licence deactivation FAILED — the seat may be stranded, release it by hand"

    # ---------------------------------------------------------------------
    # 7. Merge every shard's report and render the WP ERP Quality Report.
    # ---------------------------------------------------------------------
    merge_reports:
        name: merge-reports
        if: ${{ !cancelled() }}
        needs: [e2e_tests, money_tests, api_tests]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout wp-erp
              uses: actions/checkout@v4

            - name: Use Node 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Download every result artifact
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/all-reports
                  pattern: results-*
                  merge-multiple: false

            # One results.json per e2e shard. The generator reads a single file
            # per suite, so the shards are combined first — summing each bucket
            # rather than trusting any one shard's totals.
            - name: Combine e2e shards
              run: |
                  mkdir -p tests/pw/playwright-report
                  node -e '
                    const fs = require("fs"), path = require("path");
                    const base = "/tmp/all-reports";
                    if (!fs.existsSync(base)) process.exit(0);
                    const merged = { stats: { duration: 0 }, suites: [] };
                    let found = 0;
                    for (const dir of fs.readdirSync(base)) {
                      if (!dir.startsWith("results-e2e")) continue;
                      const f = path.join(base, dir, "results-e2e.json");
                      if (!fs.existsSync(f)) continue;
                      try {
                        const j = JSON.parse(fs.readFileSync(f, "utf8"));
                        merged.suites.push(...(j.suites || []));
                        merged.stats.duration = Math.max(merged.stats.duration, Number(j.stats?.duration) || 0);
                        found++;
                      } catch (e) { console.warn("skip", f, e.message); }
                    }
                    if (found) {
                      fs.writeFileSync("tests/pw/playwright-report/results-e2e.json", JSON.stringify(merged));
                      console.log(`combined ${found} e2e shard report(s)`);
                    }
                    for (const [suite, file] of [["money", "results-money.json"], ["api", "results-api.json"], ["license", "results-license.json"]]) {
                      const src = path.join(base, `results-${suite}`, file);
                      if (fs.existsSync(src)) {
                        fs.copyFileSync(src, path.join("tests/pw/playwright-report", file));
                        console.log(`took ${suite} report`);
                      }
                    }
                  '

            - name: Generate WP ERP Quality Report
              id: quality-report
              working-directory: tests/pw
              env:
                  OUTPUT_FILE: playwright-report/quality-report.html
                  SUMMARY_FILE: playwright-report/quality-report.md
                  SHA: ${{ github.sha }}
              run: node ./utils/generateQualityReport.js

            - name: Upload WP ERP Quality Report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: wp-erp-quality-report
                  path: tests/pw/playwright-report/quality-report.html
                  retention-days: 30
                  if-no-files-found: ignore

            - name: Append Quality Report to job summary
              if: always()
              run: |
                  if [ -f tests/pw/playwright-report/quality-report.md ]; then
                      cat tests/pw/playwright-report/quality-report.md >> "$GITHUB_STEP_SUMMARY"
                  fi
