# Kept at .github/workflows/playwright.yml deliberately.
#
# GitHub keys a workflow by its FILE PATH and only lists or dispatches workflows
# whose file is on the default branch. Introducing a new filename would mean the
# suite could not be triggered manually until after this branch merged, and would
# start a fresh entry with no run history. Reusing this path means the existing
# "E2E_API Tests" entry updates in place, keeps its history, and can be dispatched
# against this branch before the merge.
name: E2E_API Tests

on:
    # Runs once a day, plus the "Run workflow" button below for on-demand runs.
    #
    # Push and pull_request triggers are deliberately ABSENT, for a reason
    # sharper here than on other repositories: the erp-pro licence grants ONE
    # active site (`license_limit: 1`), and every run activates it. A run on
    # every push would hold that seat more or less permanently and block the
    # developers' own sites, on top of the Actions cost. Test a branch with the
    # button instead.
    schedule:
        # 02:00 UTC. GitHub queues scheduled runs and releases them when capacity
        # frees up, so the real start drifts later than the nominal time — check
        # the actual start times of recent scheduled runs before "correcting"
        # this to a different hour.
        - cron: '0 2 * * *'
    # Manual runs: pick a suite and a tier.
    workflow_dispatch:
        inputs:
            testsuite:
                description: 'Which suite to run'
                default: 'All'
                type: choice
                options:
                    - All
                    - E2E
                    - Money
                    - API
                    - License
            tier:
                description: 'Tier filter, applies to E2E only'
                default: 'all'
                type: choice
                options:
                    - all
                    - tier1
                    - tier2
                    - tier3

# The erp-pro licence allows ONE active site at a time (license_limit: 1), so two
# runs must never hold it at once. Queue instead of cancelling: a cancelled run
# skips its deactivate step and would strand the seat.
concurrency:
    group: erp-pro-license
    cancel-in-progress: false

jobs:
    e2e:
        name: e2e + money + API on wp-env :8888
        runs-on: ubuntu-latest
        timeout-minutes: 90

        defaults:
            run:
                working-directory: wp-erp/tests/pw

        env:
            BASE_URL: http://localhost:8888
            SERVER_URL: http://localhost:8888
            DB_HOST: 127.0.0.1
            DB_PORT: '8889'
            DB_USER: root
            DB_PASSWORD: password
            DB_NAME: wordpress
            DB_PREFIX: wp_
            # `ADMIN`, not `ADMIN_USERNAME` — utils/helpers.ts reads env('ADMIN')
            # and throws on a missing required variable, so the old name meant the
            # suite could never have started on a runner.
            ADMIN: admin
            ADMIN_PASSWORD: password
            ADMIN_EMAIL: admin@erp.test
            # Required: every non-admin actor authenticates with this.
            # No literal fallback: this repository is public. Set the
            # ERP_USER_PASSWORD secret; without it the suite fails fast on the
            # missing variable rather than running under a published credential.
            USER_PASSWORD: ${{ secrets.ERP_USER_PASSWORD }}
            HR_MANAGER: erp_hr_manager
            CRM_MANAGER: erp_crm_manager
            CRM_AGENT: erp_crm_agent
            CRM_AGENT_2: erp_crm_agent_2
            ACCOUNT_MANAGER: erp_ac_manager
            RECRUITER: erp_recruiter
            EMPLOYEE: erp_employee
            ERP_PRO: 'true'
            ERP_TEST_KEY: erp-pw-local
            ERP_LICENSE_EMAIL: ${{ secrets.ERP_LICENSE_EMAIL }}
            ERP_LICENSE_KEY: ${{ secrets.ERP_LICENSE_KEY }}
            ERP_LICENSE_USERS: ${{ vars.ERP_LICENSE_USERS || '100' }}
            CI: 'true'
            HEADLESS: 'true'

        steps:
            - name: Checkout wp-erp (free)
              uses: actions/checkout@v4
              with:
                  path: wp-erp

            # .wp-env.json maps ../../../erp-pro, i.e. a sibling of the wp-erp checkout.
            - name: Checkout erp-pro
              uses: actions/checkout@v4
              with:
                  repository: wp-erp/erp-pro
                  ref: develop
                  token: ${{ secrets.ERP_PRO_TOKEN }}
                  path: erp-pro

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: wp-erp/tests/pw/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Start wp-env
              run: |
                  # `.wp-env.ci.json` lists wp-erp and erp-pro under `plugins`
                  # rather than only `mappings`, which is what ACTIVATES them on a
                  # runner — the local `.wp-env.json` maps them, so they land on
                  # disk inactive. The setup bootstrap also activates them, so this
                  # is belt and braces rather than the only path.
                  cp .wp-env.ci.json .wp-env.override.json
                  npm run start:env
                  curl --retry 12 --retry-delay 5 --retry-all-errors -sf http://localhost:8888/ > /dev/null

            # Activates the real licence exactly once for the whole run.
            - name: Seed site (licence, modules, actors, fixtures)
              run: npm run setup

            - name: Regenerate harness facts
              run: npm run harness

            # On a scheduled run `inputs.testsuite` is empty, so every suite runs.
            # A manual run honours the choice.
            - name: e2e
              if: ${{ github.event.inputs.testsuite == '' || github.event.inputs.testsuite == 'All' || github.event.inputs.testsuite == 'E2E' }}
              run: npm run test:e2e -- ${{ github.event.inputs.tier == 'tier1' && '--grep @tier1' || github.event.inputs.tier == 'tier2' && '--grep @tier2' || github.event.inputs.tier == 'tier3' && '--grep @tier3' || '' }}

            # The money specs are a SEPARATE project and were never run by CI at
            # all. They share one Cash ledger and one voucher sequence, so they
            # must run single-worker: `workers` is not a per-project option in
            # Playwright, only the CLI flag enforces it. `npm run test:money`
            # carries the flag.
            - name: Accounting (money, serial)
              if: ${{ always() && (github.event.inputs.testsuite == '' || github.event.inputs.testsuite == 'All' || github.event.inputs.testsuite == 'Money') }}
              run: npm run test:money

            - name: API
              if: ${{ always() && (github.event.inputs.testsuite == '' || github.event.inputs.testsuite == 'All' || github.event.inputs.testsuite == 'API') }}
              run: npm run test:api

            # Licence-limit suite: MANUAL ONLY, never on the schedule. It seeds
            # ~69 users to stand the site on its purchased seat limit and removes
            # them again, and while it runs no other spec can create an employee.
            # Deliberately excluded from "All" so a daily run never trips over it.
            - name: Licence limit (destructive, on request)
              if: ${{ always() && github.event.inputs.testsuite == 'License' }}
              run: npm run test:license-limit

            # Renders the branded HTML report (uploaded as an artifact) and a
            # markdown variant for the run page. GitHub strips CSS from job
            # summaries, so the two are generated separately rather than one
            # being an inline copy of the other.
            #
            # `if: always()` — a report is most useful precisely when something
            # failed, and the generator never gates the run itself.
            - name: Generate WP ERP Quality Report
              id: quality-report
              if: always()
              working-directory: tests/pw
              env:
                  E2E_RESULT: playwright-report/results-e2e.json
                  MONEY_RESULT: playwright-report/results-money.json
                  API_RESULT: playwright-report/results-api.json
                  LICENSE_RESULT: playwright-report/results-license.json
                  OUTPUT_FILE: playwright-report/quality-report.html
                  SUMMARY_FILE: playwright-report/quality-report.md
                  SHA: ${{ github.sha }}
              run: node ./utils/generateQualityReport.js

            - name: Upload WP ERP Quality Report
              if: always() && steps.quality-report.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: wp-erp-quality-report
                  path: tests/pw/playwright-report/quality-report.html
                  if-no-files-found: ignore
                  retention-days: 30

            - name: Append Quality Report to job summary
              if: always() && steps.quality-report.outcome == 'success'
              run: |
                  if [ -f tests/pw/playwright-report/quality-report.md ]; then
                      cat tests/pw/playwright-report/quality-report.md >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Collect WordPress debug.log
              if: always()
              run: |
                  cp wp-data/debug.log debug.log 2>/dev/null || echo "no debug.log produced" > debug.log
                  tail -c 200000 debug.log > debug.tail.log || true

            # Runs even when the job fails or is cancelled, so the single licence
            # seat is always released back to the account.
            # `--project=teardown:license` named a project that does not exist —
            # teardown.config.ts defines `license_teardown` — and `|| true`
            # swallowed the resulting error, so this step went green while
            # releasing nothing. With one seat on the licence, that strands it for
            # every later run. Use the npm script, which targets the real project.
            #
            # `|| true` is kept ONLY so a teardown failure cannot mask the suite's
            # own result; the step now prints a warning when it fails instead of
            # passing silently.
            - name: Deactivate licence
              if: always()
              run: npm run teardown:license || echo "::warning::licence deactivation FAILED — the seat may be stranded, release it by hand" 

            - name: Upload reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: pw-reports
                  path: |
                      wp-erp/tests/pw/playwright-report/
                      wp-erp/tests/pw/blob-report/
                      wp-erp/tests/pw/summary-report/
                      wp-erp/tests/pw/test-results/
                      wp-erp/tests/pw/harness/
                      wp-erp/tests/pw/debug.tail.log
                  retention-days: 14

            - name: Stop wp-env
              if: always()
              run: npm run stop:env || true
