# WP ERP feature map — the denominator for e2e coverage.
#
# Each entry is a FEATURE, keyed by the exact Playwright test title that proves it.
# 'true' means an automated test exists; 'false' means the feature is known and
# deliberately NOT automated yet — those are what the coverage report reports as
# uncovered. A feature with no entry at all is invisible to coverage, so add the
# entry (false) BEFORE the test exists, not after.
#
# '[lite]' marks a feature that exists in free wp-erp. On a lite run (ERP_PRO=false)
# only [lite] entries count toward the denominator, mirroring the @lite/@pro grep in
# playwright.config.ts.
#
# Generated 2026-08-06 from the suite's own test list (388 e2e tests, ERP_PRO=true),
# then extended by hand with the not-yet-automated areas from the manual suite.
# Keep it in sync when a test title changes — a renamed title silently drops a
# feature to uncovered, which is the intended failure mode (loud, not silent).

