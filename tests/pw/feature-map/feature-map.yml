# ── Known and NOT automated ───────────────────────────────────────────────────
# Every entry below is false on purpose: the feature exists in the product and has
# manual coverage, but no Playwright test asserts it. Names are the AREA names from
# the Lead-QA manual suite (test-cases/2026-07-30-erp-new-ui-full.md §5 "Area index",
# 540 cases across 20 areas) — they are copied from that index, not invented here.
#
# These are what stop the coverage number from reading 100% while whole React
# screens go untested. As each area is automated, replace the area-level entry with
# per-test entries set to true.
- page: 'not automated (manual-suite areas)'
  features:
      hrm (new UI):
          'SHELL — remaining Tier-2/3 cases (theme, i18n, list-state persistence) [lite]': false
          'DASH — widget-level cases (count reconciliation, Present Today, calendar visibility, birthday mail) [lite]': false
          'EMP — employees list [lite]': false
          'EMPCRUD — employee create / edit / lifecycle [lite]': false
          'PROF — employee profile (v1-v4) + My Profile [lite]': false
          'ORG — departments, designations, org chart, announcements, requests [lite]': false
          'LEAVE — requests, entitlements, policies, types, holidays, calendar, FY [lite]': false
          'HRREP — HR reports (6 report routes) [lite]': false
      pro modules:
          'REIM — reimbursement (UI; REST is covered)': false
      cross-cutting:
          'PERM — permissions, isolation, privacy (security) [lite]': false
          'WF — real-life multi-actor user workflows (end-to-end) [lite]': false

